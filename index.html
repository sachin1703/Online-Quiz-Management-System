<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Quiz Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <section class="auth-hero">
    <span class="hero-kicker">Online Quiz Platform</span>
    <h1>Quiz Management System</h1>
    <p>Practice smarter. Measure faster. Improve every attempt.</p>
  </section>
  <main class="auth-box">
    <h1>Quiz Login</h1>
    <input id="username" type="text" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button type="button" onclick="login()">Login</button>
    <p><a href="signup.html">Create a new account</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
